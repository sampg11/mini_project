<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookora — Login</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


:root{

    --bg:#09090f;
    --card:#11111a;
    --text:#f7f4ef;
    --muted:#9696a8;
    --primary:#a78bfa;
    --primary-dark:#7c3aed;
    --border:rgba(255,255,255,.08);

}



body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(circle at 10% 10%,rgba(124,58,237,.25),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(167,139,250,.15),transparent 30%),
    var(--bg);

    color:var(--text);

    font-family:"DM Sans",sans-serif;

}



.container{

    width:100%;
    max-width:450px;
    padding:25px;

}



.card{

    background:rgba(17,17,26,.85);

    backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:25px;

    padding:45px 35px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.5);

}



.logo{

    text-align:center;

    font-size:28px;

    font-weight:800;

    margin-bottom:35px;

}


.logo span{

    color:var(--primary);

}



.logo-icon{

    display:inline-grid;

    place-items:center;

    width:45px;
    height:45px;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
    );

    margin-right:8px;

}



h1{

    font-family:"Playfair Display",serif;

    font-size:42px;

    text-align:center;

    margin-bottom:10px;

}



.subtitle{

    color:var(--muted);

    text-align:center;

    margin-bottom:35px;

}



label{

    display:block;

    font-size:14px;

    font-weight:600;

    margin-bottom:8px;

}



input{

    width:100%;

    padding:14px 16px;

    background:#0d0d14;

    border:1px solid var(--border);

    border-radius:13px;

    color:white;

    outline:none;

    margin-bottom:20px;

    font-size:15px;

}



input:focus{

    border-color:var(--primary);

    box-shadow:0 0 20px rgba(167,139,250,.2);

}



button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
    );

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 35px rgba(124,58,237,.35);

}



.error{

    background:rgba(239,68,68,.15);

    color:#fca5a5;

    border:1px solid rgba(239,68,68,.3);

    padding:12px;

    border-radius:12px;

    margin-bottom:20px;

    font-size:14px;

}



.bottom{

    margin-top:25px;

    text-align:center;

    color:var(--muted);

    font-size:14px;

}



.bottom a{

    color:var(--primary);

    text-decoration:none;

    font-weight:700;

}



</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">

    <span class="logo-icon">📖</span>
    Book<span>ora</span>

</div>



<h1>
    Welcome Back
</h1>


<p class="subtitle">
    Login to continue your reading journey.
</p>



{% if form.errors %}

<div class="error">

    Invalid username or password.

</div>

{% endif %}



<form method="post">

{% csrf_token %}



<label>
    Username
</label>

<input
type="text"
name="username"
placeholder="Enter your username"
required
>



<label>
    Password
</label>


<input
type="password"
name="password"
placeholder="Enter your password"
required
>



<button type="submit">

Login

</button>


</form>




<div class="bottom">

Don't have an account?

<a href="{% url 'register' %}">
Create Account
</a>


</div>


</div>


</div>



</body>

</html>
